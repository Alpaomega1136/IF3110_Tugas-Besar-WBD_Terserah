name: Backend
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BE
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: BE/go.mod
          cache-dependency-path: BE/go.sum
      - name: Prepare local PostgreSQL
        run: |
          sudo systemctl start postgresql
          sudo -u postgres psql --set ON_ERROR_STOP=1 -c "CREATE ROLE test LOGIN PASSWORD 'test_only';"
          sudo -u postgres psql --set ON_ERROR_STOP=1 -c "CREATE DATABASE platform_test OWNER test;"
      - run: go mod download
      - name: Formatting
        run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go test -race -tags=integration ./tests/integration/... -count=1
        env:
          TEST_DATABASE_URL: postgres://test:test_only@localhost:5432/platform_test?sslmode=disable
      - run: go build ./...

