<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <main class="login-container">
        <div class="login-card">
            <h1>Terserah Database Platform</h1>
            <h2>Login to your account</h2>

            <form id="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="login-button">
                    Login
                </button>

                <p id="login-message" role="status"></p>
            </form>
        </div>
    </main>

    <script>
        const form = document.getElementById("login-form");
        const button = document.getElementById("login-button");
        const message = document.getElementById("login-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const formData = new FormData(form);
            const username = formData.get("username");
            const password = formData.get("password");

            button.disabled = true;
            button.textContent = "Logging in...";
            message.textContent = "";
            message.className = "";

            try {
                const response = await fetch("/api/v1/auth/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    credentials: "same-origin",
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (!response.ok) {
                    message.textContent = data.error?.message || "Login gagal";
                    message.className = "error-message";
                    return;
                }

                message.textContent = "Login berhasil! Selamat datang, " + data.user.username;
                message.className = "success-message";

                form.reset();

            } catch (error) {
                message.textContent = "Terjadi kesalahan saat menghubungi server.";
                message.className = "error-message";
            } finally {
                button.disabled = false;
                button.textContent = "Login";
            }
        });
    </script>
</body>
</html>
